# შემოტევასთან დაკავშირებული მესიჯების გაგზავნა თქვენს Discord სერვერში შეიძლება ვებჰუკების მეშვეობით
webhook:
  # ვებჰუკის ლინკი (დააყენეთ ეს '' თუ გინდათ, რომ გათიშოთ ეს ფუნქცია)
  url: ''
  # სახელი ვებჰუკის გამგზავნელის
  username: Sonar
  # ლინკი ავატარის, რომელიც იქნება ვებჰუკის ავატარად გამოყენებული (დააყენეთ ეს '' თუ გინდათ, რომ გათიშოთ ეს ფუნქცია)
  avatar-url: ''
  # ვებჰუკის შეტყობინების შინაარსი (დააყენეთ ეს '' თუ გინდათ, რომ გათიშოთ ეს ფუნქცია)
  # თქვენ შეგიძლიათ ეს გამოიყენოთ, რომ მაგალითად მოთაგოთ სტაფის წევრი <@userId>
  # თუ გინდათ, რომ მოთაგოთ როლი, გამოიყენეთ ეს <@&roleId>
  content: ''
  # განათავსეთ ვებჰუკის შეტყობინება, რომელიც იგზავნება შეტევის შეჩერებისას
  embed:
    # ვებჰუკის შეტყობინების ქვედა მცირე ტექსტი
    footer:
      # ვებჰუკის ქვედა მცირე შეტყობინების შინაარსი
      text: © Jones Development and Sonar Contributors
      # ლინკი ქვედა მცირე შეტყობინობის ავატარისთვის
      icon-url: ''
    # ვებჰუკის სათაური
    title: ':white_check_mark: შეტევა გადატანილია'
    # ლინკი რომელზეც გადავნენ ვებჰუკის სათაურზე დაჭერის შემდეგ
    title-url: ''
    # აღწერა (ტექსტი) ვებჰუკის მესიჯის
    description:
      - თქვენს სერვზე განხორციელებული შემოტევა წარმატებულად იყო გადატანილი.
      - ''
      - 'შემოტევა დაიწყო: <t:<start-timestamp>:T>'
      - 'შემოტევა დასრულდა: <t:<end-timestamp>:T>'
      - 'შემოტევის ხანგრძლივობა: <attack-duration>'
      - ''
      - 'CPU-ის გამოყენების პიკი შეტევის დროს: <peak-cpu>%'
      - 'RAM-ის გამოყენების პიკი შეტევის დროს: <peak-memory>'
      - 'ბოტების პიკი წამში შეტევის დროს: <peak-bps>'
      - ''
      - 'შეტევის დროს შავ სიაში IP მისამართები: <total-blacklisted>'
      - 'შეტევის დროს ვერიფიკაცია ვერ შეასრულა: <total-failed>'
      - 'წარმატებულად ვერიფირებული თავდასხმის დროს: <total-success>'
    # RGB ფერები ვებჰუკის მესიჯისთვის
    # Color picker: https://www.rapidtables.com/web/color/RGB_Color.html
    color:
      red: 0
      green: 255
      blue: 0
  # Embed Discord webhook message that is sent when an attack has been detected
  attack-start-embed:
    # Should Sonar also send a message when an attack starts?
    enabled: true
    # Title of the Discord webhook embed
    title: ':warning: Attack detected'
    # Clickable URL of the title of the Discord webhook embed
    title-url: ''
    # Description (content) of the Discord webhook embed
    description:
      - Sonar has detected an attack on your server.
      - ''
      - 'Attack start: <t:<start-timestamp>:T>'
      - 'Bots per second: <bps>'
      - 'Connections per second: <cps>'
      - 'Verifying players: <verifying>'
      - 'Queued players: <queued>'
    # RGB colors of the Discord webhook embed
    color:
      red: 255
      green: 165
      blue: 0

# Attack notifications can also be sent as plain JSON to any HTTP(S) endpoint
# Body: {"event": "attack_start" | "attack_end", "timestamp": <unix seconds>, "data": {...}}
generic-webhook:
  # URL of the endpoint (Set this to '' to disable the generic webhook)
  url: ''
